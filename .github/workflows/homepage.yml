name: Homepage und neueste Langvideos

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Drei neueste veröffentlichte Langvideos lesen
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/update_videos.py
      - name: Öffentliche Homepage zusammenstellen
        run: |
          mkdir _site
          cp index.html lkw.html simson.html robots.txt sitemap.xml datenschutz.html nutzungsbedingungen.html impressum.html CNAME favicon.ico apple-touch-icon.png _site/
          find . -maxdepth 1 -type f \( -name '*-test.html' -o -name 'review-*.html' \) -exec cp {} _site/ \;
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Homepage veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
